add_header X-Frame-Options            "DENY"                                always;
add_header X-Content-Type-Options     "nosniff"                             always;
add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
add_header Permissions-Policy         "geolocation=(), microphone=()"       always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.openweathermap.org https://tile.openweathermap.org https://api.rainviewer.com https://tilecache.rainviewer.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.tile.openstreetmap.org https://raw.githubusercontent.com https://servicodados.ibge.gov.br; frame-ancestors 'none';" always;
