services:
  # ─── Infraestrutura ───────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    environment:
      POSTGRES_DB: nps_db
      POSTGRES_USER: nps_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    mem_limit: 256m
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c max_connections=30
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nps_user -d nps_db && pg_isready -U nps_user -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Projeto 1: Weather API (interno — sem porta exposta) ──
  weather-api:
    build:
      context: ./weather-api
      dockerfile: Dockerfile
    container_name: portfolio-weather-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-network

  # ─── Projeto 2: NPS API (interno — sem porta exposta) ─────
  nps-api:
    build:
      context: ./nps-api
      dockerfile: Dockerfile
    container_name: portfolio-nps-api
    environment:
      DATABASE_URL: postgresql://nps_user:${POSTGRES_PASSWORD}@postgres:5432/nps_db
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://gateway-api:4000
      NODE_OPTIONS: --max-old-space-size=64
    mem_limit: 96m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-network

  # ─── Projeto 3: Frontend (interno — sem porta exposta) ────
  portfolio-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    environment:
      NEXT_PUBLIC_WEATHER_API_URL: /api/weather
      NEXT_PUBLIC_NPS_API_URL: /api/nps
    mem_limit: 128m
    depends_on:
      - weather-api
      - nps-api
    networks:
      - portfolio-network

  # ─── Projeto 4: API Gateway (interno — sem porta exposta) ─
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: portfolio-api-gateway
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 2h
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      WEATHER_API_URL: http://weather-api:8080
      NPS_API_URL: http://nps-api:3001
      NODE_OPTIONS: --max-old-space-size=64
    mem_limit: 96m
    depends_on:
      - weather-api
      - nps-api
    networks:
      - portfolio-network

  # ─── Projeto 5: Nginx — ÚNICO ponto de entrada ────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: portfolio-nginx
    ports:
      - "80:80"   # Única porta exposta ao host
    depends_on:
      - portfolio-frontend
      - gateway-api
    networks:
      - portfolio-network

volumes:
  postgres-data:

networks:
  portfolio-network:
    driver: bridge
