services:

  # ─── Infraestrutura ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nps_db
      POSTGRES_USER: nps_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c max_connections=30
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nps_user -d nps_db && pg_isready -U nps_user -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Projeto 1: Weather API ───────────────────────────────────
  weather-api:
    build:
      context: ./weather-api
      dockerfile: Dockerfile
    container_name: portfolio-weather-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
    mem_limit: 420m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ─── Projeto 2: NPS API ───────────────────────────────────────
  nps-api:
    build:
      context: ./nps-api
      dockerfile: Dockerfile
    container_name: portfolio-nps-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nps_user:${POSTGRES_PASSWORD}@postgres:5432/nps_db
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://gateway-api:4000
      NODE_OPTIONS: --max-old-space-size=64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ─── Projeto 4: API Gateway ───────────────────────────────────
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: portfolio-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGINS: "http://localhost,http://nginx,https://diogoportfolio.opiniaolivre.com"
      WEATHER_API_URL: http://weather-api:8080
      NPS_API_URL: http://nps-api:3001
      NODE_OPTIONS: --max-old-space-size=64
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      weather-api:
        condition: service_healthy
      nps-api:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ─── Nginx — único ponto de entrada ──────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NGINX_CONF: ${NGINX_CONF:-nginx.dev.conf}
        NEXT_PUBLIC_OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      gateway-api:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Certbot (somente prod) ───────────────────────────────────
  # NOTA: após renovação automática, o nginx NÃO é recarregado automaticamente.
  # O --deploy-hook registra a renovação no log. Para aplicar o certificado
  # renovado, execute manualmente: docker compose exec nginx nginx -s reload
  certbot:
    profiles: [prod]
    image: certbot/certbot:v2.11.0
    container_name: portfolio-certbot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --quiet
      --deploy-hook \"echo 'Certificate renewed at $$(date)' >> /var/log/letsencrypt/renewals.log\";
      sleep 12h & wait $${!}; done"

  # ─── Seed weather (idempotente, roda a cada startup) ────────
  seed:
    image: curlimages/curl:8.7.1
    container_name: portfolio-seed
    depends_on:
      weather-api:
        condition: service_healthy
    volumes:
      - ./scripts/seed-weather.sh:/seed.sh:ro
    entrypoint: sh /seed.sh
    restart: "no"
    networks:
      - portfolio-network

  # ─── Seed NPS (idempotente, roda a cada startup) ─────────────
  seed-nps:
    image: postgres:15.6-alpine
    container_name: portfolio-seed-nps
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      nps-api:
        condition: service_healthy
    volumes:
      - ./postgres/init/02-seed-nps.sql:/seed-nps.sql:ro
    command: psql -h postgres -U nps_user -d nps_db -f /seed-nps.sql
    restart: "no"
    networks:
      - portfolio-network

volumes:
  postgres-data:
  certbot-certs:
  certbot-webroot:

networks:
  portfolio-network:
    driver: bridge
